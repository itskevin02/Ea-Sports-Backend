spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.default_schema=esports_auth

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

spring.h2.console.enabled=false

$env:DB_USUARIO = Read-Host "postgres.ttxsmfyknhdjymwkqghi"
$env:SPRING_DATASOURCE_USERNAME = $env:DB_USUARIO
$env:SPRING_DATASOURCE_PASSWORD = $env:DB_CLAVE