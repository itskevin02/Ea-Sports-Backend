spring.application.name=msvc-user

server.port=8083

spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
app.jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-de-al-menos-32-bytes}
app.sanction.url=${SANCTION_SERVICE_URL:http://localhost:8089}
app.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}